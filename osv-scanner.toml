[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """uuid <11.1.1 missing buffer bounds check in v3/v5/v6 when a caller passes an output buf. \
Fixed only in 11.x+. Old majors come from transitive deps (sockjs, @material-table/core, gaxios, \
google-gax, teeny-request, dockerode, mockttp) that call uuid v1()/v4() without a caller-supplied \
buffer (checked in node_modules), so the affected v3/v5/v6 buf path is not used. Waiting on those packages to move to uuid 11+."""
