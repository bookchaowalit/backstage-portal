# Reviewed OSV-Scanner exceptions. Each entry needs a reason and an expiry.
# Context: Backstage 1.55.3 (latest stable release, see backstage.json). Every advisory below
# either has no fixed release at all, or is fixed only in a new major version of a transitive
# dependency that the Backstage packages pin to an older major. Overriding those across a
# major would change APIs inside Backstage code we do not own. Re-check on each Backstage
# release bump (Renovate) and at the expiry date.

[[IgnoredVulns]]
id = "GHSA-7mx3-vvmw-hjmv"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """@graphql-tools/utils 8.x mergeDeep prototype pollution; fixed only in 12.x. Pulled in by \
mockttp 3 via @backstage/backend-openapi-utils (OpenAPI test/validation helpers). This portal \
serves no GraphQL API and never merges request data through graphql-tools. Waiting on Backstage to \
move mockttp/graphql-tools to a fixed major."""

[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r"
ignoreUntil = 2027-01-17T00:00:00Z
reason = """basic-ftp 5.x Client.list() CPU DoS on crafted FTP directory listings; fixed only in 6.x. \
